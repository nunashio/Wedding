<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу — Максим & Вероника</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Marck+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F0EB;
            --brown: #8B7355;
            --dark-brown: #5C4A3A;
            --light-brown: #C4A882;
            --cream: #EDE4D8;
            --black: #1A1A1A;
            --white: #FFFFFF;
            --gold: #A68A64;
            --accent: #D4C4B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle, rgba(139,115,85,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--black);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* ========== ВСТУПИТЕЛЬНЫЙ ЭКРАН ========== */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--cream);
            background-image:
                radial-gradient(circle, rgba(139,115,85,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: var(--dark-brown);
            letter-spacing: 4px;
            text-align: center;
            animation: gentleFloat 3s ease-in-out infinite;
        }

        .intro-heart {
            font-size: 56px;
            margin: 30px 0;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .intro-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--brown);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            56% { transform: scale(1); }
        }

        /* ========== ОСНОВНОЙ КОНТЕНТ ========== */
        .main-content {
            max-width: 750px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.9s ease forwards;
            opacity: 0;
        }

        .fade-in-delay-1 { animation-delay: 0.2s; }
        .fade-in-delay-2 { animation-delay: 0.4s; }
        .fade-in-delay-3 { animation-delay: 0.6s; }
        .fade-in-delay-4 { animation-delay: 0.8s; }
        .fade-in-delay-5 { animation-delay: 1s; }

        /* ========== МУЗЫКА ========== */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--light-brown);
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .music-btn:hover {
            background: var(--brown);
            color: var(--white);
            border-color: var(--brown);
        }

        .music-btn.playing {
            animation: musicPulse 2s ease-in-out infinite;
            background: var(--brown);
            color: var(--white);
            border-color: var(--brown);
        }

        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139,115,85,0.4); }
            50% { box-shadow: 0 0 0 20px rgba(139,115,85,0); }
        }

        /* ========== СЕКЦИИ ========== */
        section {
            padding: 55px 0;
            position: relative;
        }

        .section-box {
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(196,168,130,0.25);
            border-radius: 12px;
            padding: 45px 35px;
            margin: 20px 0;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .section-box::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--light-brown), transparent);
        }

        .section-box::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--light-brown), transparent);
        }

        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 35px 0;
        }

        .section-divider .line {
            width: 70px;
            height: 1px;
            background: var(--light-brown);
        }

        .section-divider .monogram {
            font-family: 'Great Vibes', cursive;
            font-size: 38px;
            color: var(--gold);
        }

        .section-divider .ornament {
            font-size: 22px;
            color: var(--gold);
            letter-spacing: 8px;
        }

        /* ========== ГЛАВНЫЙ ЭКРАН ========== */
        .hero {
            text-align: center;
            padding: 30px 0 50px;
        }

        .hero-names {
            font-family: 'Great Vibes', cursive;
            font-size: 64px;
            color: var(--dark-brown);
            letter-spacing: 3px;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .hero-ampersand {
            color: var(--gold);
            font-style: normal;
        }

        .hero-date-line {
            font-family: 'Montserrat', sans-serif;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--brown);
            margin-bottom: 20px;
        }

        .hero-arrow {
            font-size: 40px;
            color: var(--gold);
            margin: 15px 0 30px;
            animation: gentleFloat 2s ease-in-out infinite;
        }

        /* ========== ФОТО В ПРОЗРАЧНОЙ РАМКЕ ========== */
        .photo-frame {
            position: relative;
            width: 280px;
            height: 370px;
            margin: 0 auto 35px;
            border: 14px solid rgba(139, 115, 85, 0.2);
            border-radius: 6px;
            background: linear-gradient(135deg, var(--cream) 0%, #E8DDD0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(92, 74, 58, 0.12);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-frame-placeholder {
            text-align: center;
            color: var(--brown);
            opacity: 0.5;
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            padding: 20px;
        }

        .photo-frame-placeholder .ph-icon {
            font-size: 55px;
            display: block;
            margin-bottom: 15px;
        }

        /* ========== КАЛЕНДАРИК ========== */
        .calendar-mini {
            width: 240px;
            margin: 35px auto;
            background: var(--white);
            border: 1px solid var(--accent);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0,0,0,0.06);
        }

        .calendar-header {
            background: var(--dark-brown);
            color: var(--white);
            text-align: center;
            padding: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .calendar-body {
            padding: 18px;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: var(--brown);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--dark-brown);
        }

        .calendar-days span {
            padding: 6px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .calendar-days .empty {
            color: transparent;
        }

        .calendar-days .day-15 {
            background: var(--brown);
            color: var(--white);
            position: relative;
            font-weight: 600;
            animation: borderGlow 2s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139,115,85,0.5); }
            50% { box-shadow: 0 0 0 10px rgba(139,115,85,0); }
        }

        .calendar-hearts {
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
            color: var(--brown);
            letter-spacing: 4px;
        }

        /* ========== ТЕКСТОВЫЕ СТИЛИ ========== */
        .text-center {
            text-align: center;
        }

        .heading-caps {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: var(--brown);
            margin-bottom: 22px;
        }

        .heading-script {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: var(--dark-brown);
            letter-spacing: 2px;
            margin-bottom: 18px;
            line-height: 1.2;
            text-align: center;
        }

        .heading-serif {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 300;
            color: var(--dark-brown);
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .text-body {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 300;
            color: #555;
            line-height: 2;
            text-align: center;
            max-width: 580px;
            margin: 0 auto;
        }

        .text-highlight {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            color: var(--dark-brown);
            font-style: italic;
        }

        /* ========== ПРОГРАММА ДНЯ ========== */
        .program-item {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            margin-bottom: 35px;
            padding-bottom: 30px;
            border-bottom: 1px dotted var(--accent);
        }

        .program-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .program-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--brown);
            min-width: 75px;
            letter-spacing: 2px;
            flex-shrink: 0;
            padding-top: 3px;
        }

        .program-info {
            flex: 1;
        }

        .program-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 500;
            color: var(--dark-brown);
            margin-bottom: 6px;
        }

        .program-desc {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #777;
            line-height: 1.6;
        }

        /* ========== КАРТА ========== */
        .venue-photo-placeholder {
            width: 100%;
            max-width: 520px;
            height: 220px;
            margin: 25px auto;
            background: linear-gradient(135deg, var(--cream) 0%, #DDD2C5 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            color: var(--brown);
            opacity: 0.6;
            font-size: 17px;
            border: 1px solid var(--accent);
        }

        .btn-map {
            display: inline-block;
            padding: 15px 38px;
            border: 2px solid var(--brown);
            color: var(--brown);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 6px;
            margin-top: 12px;
        }

        .btn-map:hover {
            background: var(--brown);
            color: var(--white);
        }

        /* ========== ТАЙМЕР НА ФОТО ========== */
        .timer-photo-block {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 320px;
            margin: 25px auto;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #D5C9B8 0%, #C4B5A0 100%);
        }

        .timer-photo-block .timer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(92, 74, 58, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-grid {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .timer-cell {
            text-align: center;
        }

        .timer-cell .number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 60px;
            font-weight: 300;
            color: var(--white);
            line-height: 1;
        }

        .timer-cell .label {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.8);
            margin-top: 6px;
        }

        .timer-colon {
            font-family: 'Cormorant Garamond', serif;
            font-size: 44px;
            color: rgba(255,255,255,0.7);
            font-weight: 300;
        }

        .timer-photo-caption {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            color: var(--brown);
            font-style: italic;
            margin-top: 18px;
        }

        /* ========== АНКЕТА ========== */
        .rsvp-form {
            background: var(--white);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 40px 30px;
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--brown);
            margin-bottom: 10px;
            display: block;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: var(--black);
            background: var(--bg);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--brown);
            box-shadow: 0 0 0 4px rgba(139, 115, 85, 0.08);
        }

        .form-input::placeholder {
            color: #bbb;
        }

        .radio-group {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 14px 24px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            transition: all 0.3s ease;
            background: var(--bg);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--dark-brown);
        }

        .radio-option:hover {
            border-color: var(--light-brown);
        }

        .radio-option input[type="radio"] {
            accent-color: var(--brown);
            width: 16px;
            height: 16px;
        }

        .drinks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 10px;
        }

        .drink-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: var(--bg);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--dark-brown);
        }

        .drink-option:hover {
            border-color: var(--light-brown);
        }

        .drink-option input[type="checkbox"] {
            display: none;
        }

        .drink-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--light-brown);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .drink-option input:checked + .drink-checkbox {
            background: var(--brown);
            border-color: var(--brown);
        }

        .drink-option input:checked + .drink-checkbox::after {
            content: '✓';
            color: var(--white);
            font-size: 14px;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--brown);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-submit:hover {
            background: var(--dark-brown);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(92, 74, 58, 0.3);
        }

        .form-success {
            display: none;
            text-align: center;
            padding: 35px;
            color: var(--brown);
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
        }

        .form-success.show {
            display: block;
        }

        /* ========== ОРГАНИЗАТОР ========== */
        .organizer-block {
            text-align: center;
            padding: 35px;
            background: var(--white);
            border-radius: 10px;
            border: 1px solid var(--accent);
        }

        .organizer-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            color: var(--dark-brown);
            margin-bottom: 8px;
        }

        .organizer-phone {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            color: var(--brown);
            text-decoration: none;
            margin: 10px 0;
            transition: color 0.3s;
        }

        .organizer-phone:hover {
            color: var(--dark-brown);
        }

        .organizer-vk {
            display: inline-block;
            padding: 12px 28px;
            background: var(--brown);
            color: var(--white);
            text-decoration: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-top: 12px;
        }

        .organizer-vk:hover {
            background: var(--dark-brown);
        }

        /* ========== ДЕКОРАТИВНЫЕ УГЛЫ ========== */
        .corner-decoration {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: var(--light-brown);
            border-style: solid;
            opacity: 0.4;
            pointer-events: none;
        }

        .corner-tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
        .corner-tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
        .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
        .corner-br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

        /* ========== ФУТЕР ========== */
        .footer {
            text-align: center;
            padding: 50px 0;
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: var(--dark-brown);
        }

        /* ========== МОБИЛЬНАЯ АДАПТАЦИЯ ========== */
        @media (max-width: 600px) {
            .hero-names {
                font-size: 44px;
            }

            .heading-script {
                font-size: 36px;
            }

            .heading-serif {
                font-size: 30px;
            }

            .timer-grid {
                gap: 15px;
            }

            .timer-cell .number {
                font-size: 42px;
            }

            .timer-colon {
                font-size: 30px;
            }

            .timer-photo-block {
                height: 250px;
            }

            .calendar-mini {
                width: 200px;
            }

            .photo-frame {
                width: 220px;
                height: 300px;
            }

            .drinks-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }

            .program-item {
                flex-direction: column;
                gap: 8px;
            }

            .section-box {
                padding: 30px 20px;
            }

            .main-content {
                padding: 30px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== ВСТУПИТЕЛЬНЫЙ ЭКРАН ========== -->
    <div class="intro-overlay" id="introOverlay" onclick="openInvitation()">
        <p class="intro-text">Вы получили приглашение</p>
        <div class="intro-heart">💌</div>
        <p class="intro-subtitle">Нажмите, чтобы открыть</p>
    </div>

    <!-- ========== КНОПКА МУЗЫКИ ========== -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="Включить музыку">🎵</button>

    <!-- Скрытый аудиоплеер — Sting «Shape of My Heart» -->
    <audio id="bgMusic" loop preload="auto" volume="0.3">
        <source src="music.mp3" type="audio/mpeg">

    <!-- ========== ОСНОВНОЙ КОНТЕНТ ========== -->

            // ========== ВСТУПИТЕЛЬНЫЙ ЭКРАН ==========
    function openInvitation() {
        document.getElementById('introOverlay').classList.add('hidden');
        // Пытаемся запустить музыку
        var music = document.getElementById('bgMusic');
        if (music) {
            music.volume = 0.3;
            music.play().then(function() {
                var btn = document.getElementById('musicBtn');
                btn.classList.add('playing');
                btn.textContent = '🎵';
            }).catch(function() {
                console.log('Музыка не загрузилась, но сайт открыт');
            });
        }
    }

    // ========== МУЗЫКА ==========
    function toggleMusic() {
        var music = document.getElementById('bgMusic');
        var btn = document.getElementById('musicBtn');
        
        if (!music) {
            btn.textContent = '⚠️';
            return;
        }

        if (!music.paused) {
            music.pause();
            btn.classList.remove('playing');
            btn.textContent = '🔇';
            return;
        }

        music.volume = 0.3;
        music.play().then(function() {
            btn.classList.add('playing');
            btn.textContent = '🎵';
        }).catch(function() {
            btn.textContent = '⚠️';
        });
    }

    // ========== КАЛЕНДАРИК ==========
    function buildCalendar() {
        var container = document.getElementById('calendarDays');
        if (!container) return;
        var firstDay = 6;
        var daysInMonth = 31;
        var html = '';

        for (var i = 0; i < firstDay; i++) {
            html += '<span class="empty">·</span>';
        }
        for (var d = 1; d <= daysInMonth; d++) {
            if (d === 15) {
                html += '<span class="day-15">15</span>';
            } else {
                html += '<span>' + d + '</span>';
            }
        }
        container.innerHTML = html;
    }
    buildCalendar();

    // ========== ТАЙМЕР ==========
    var weddingDate = new Date('2026-08-15T13:00:00');

    function updateTimer() {
        var now = new Date();
        var diff = weddingDate - now;

        var daysEl = document.getElementById('tDays');
        var hoursEl = document.getElementById('tHours');
        var minutesEl = document.getElementById('tMinutes');
        var secondsEl = document.getElementById('tSeconds');

        if (!daysEl) return;

        if (diff <= 0) {
            daysEl.textContent = '00';
            hoursEl.textContent = '00';
            minutesEl.textContent = '00';
            secondsEl.textContent = '00';
            return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((diff % (1000 * 60)) / 1000);

        daysEl.textContent = String(days).padStart(2, '0');
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');
        secondsEl.textContent = String(seconds).padStart(2, '0');
    }
    updateTimer();
    setInterval(updateTimer, 1000);

    // ========== АНКЕТА ==========
    var rsvpForm = document.getElementById('rsvpForm');
    if (rsvpForm) {
        rsvpForm.addEventListener('submit', function(e) {
            e.preventDefault();

            var formData = new FormData(this);
            var checkedDrinks = document.querySelectorAll('input[name="drinks"]:checked');
            var drinksList = Array.from(checkedDrinks).map(function(cb) { return cb.value; }).join(', ') || 'Не указано';

            var data = {
                name: formData.get('name'),
                attendance: formData.get('attendance') === 'yes' ? 'Да, смогу' : 'К сожалению, не смогу',
                drinks: drinksList
            };

            console.log('Данные анкеты:', data);

            document.getElementById('rsvpForm').style.display = 'none';
            document.getElementById('formSuccess').classList.add('show');
        });
    }

    // ========== АНИМАЦИЯ ПРИ СКРОЛЛЕ ==========
    var fadeElements = document.querySelectorAll('.fade-in');
    if (fadeElements.length > 0 && 'IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, { threshold: 0.1 });

        fadeElements.forEach(function(el) {
            observer.observe(el);
        });
    } else {
        // Если IntersectionObserver не поддерживается — показываем всё сразу
        fadeElements.forEach(function(el) {
            el.style.opacity = '1';
            el.style.animation = 'none';
        });
    }
    </script>
